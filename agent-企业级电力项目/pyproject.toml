[project]
name = "power-agent-enterprise"
version = "5.0.0"
description = "电力智能分析 Agent 企业级版本"
requires-python = ">=3.12"
dependencies = [
    # LLM / Agent 框架
    "langchain>=1.3.0",
    "langchain-core>=1.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=0.2.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint>=4.1.0",
    "langgraph-checkpoint-sqlite>=3.1.0",

    # 向量检索
    "langchain-milvus>=0.1.0",
    "milvus-lite>=2.5.0",
    "pymilvus>=2.5.0",
    "chromadb>=0.5.0",

    # Embedding
    "sentence-transformers>=5.6.0",
    "torch>=2.5.0",

    # 文档解析
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "ezdxf>=1.3.0",

    # 缓存 / 消息
    "redis>=5.0.0",

    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sse-starlette>=2.0.0",

    # MCP
    "mcp>=1.0.0",

    # 工具
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.8.0",
    "loguru>=0.7.0",
    "psutil>=6.0.0",
    "structlog>=24.0.0",

    # 测试
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "rag", "api", "config", "memory", "llm", "gateway", "mq", "observability", "eval", "mcp_servers", "db"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
